name: Build Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Configure Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"
      - name: Install dependencies
        run: npm ci
      - name: Build and sync Android app
        run: npm run android:sync
      - name: Configure release signing
        env:
          LEDGER_KEYSTORE_BASE64: ${{ secrets.LEDGER_KEYSTORE_BASE64 }}
          LEDGER_KEYSTORE_PASSWORD: ${{ secrets.LEDGER_KEYSTORE_PASSWORD }}
        run: |
          test -n "$LEDGER_KEYSTORE_BASE64" && test -n "$LEDGER_KEYSTORE_PASSWORD" || { echo "Release signing secrets are missing"; exit 1; }
          echo "$LEDGER_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/daily-ledger-release.jks"
      - name: Build installable APK
        working-directory: android
        env:
          LEDGER_KEYSTORE_PATH: ${{ runner.temp }}/daily-ledger-release.jks
          LEDGER_KEYSTORE_PASSWORD: ${{ secrets.LEDGER_KEYSTORE_PASSWORD }}
        run: chmod +x gradlew && ./gradlew assembleRelease
      - name: Prepare release asset
        run: cp android/app/build/outputs/apk/release/app-release.apk Daily-Ledger-Android.apk
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Daily Ledger ${{ github.ref_name }}
          generate_release_notes: true
          files: Daily-Ledger-Android.apk
      - name: Upload workflow artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: Daily-Ledger-Android
          path: Daily-Ledger-Android.apk
